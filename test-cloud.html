<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>云同步联调测试</title>
</head>
<body>
<pre id="out">测试启动中…</pre>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.17.3/cloudbase.full.js"></script>
<script src="js/config.js?v=2"></script>
<script>
var OUT = document.getElementById('out');
function log(s) { OUT.textContent += '\n' + s; }
function jerr(e) {
  var s = {};
  for (var k in e) if (e.hasOwnProperty(k)) s[k] = e[k];
  return JSON.stringify(s);
}
setTimeout(function () {
  log('SDK 加载: ' + (typeof window.cloudbase !== 'undefined' ? '是' : '否（SDK CDN 失败）'));
  if (typeof window.cloudbase === 'undefined') return;
  try {
    var app = cloudbase.init({ env: CFG.CLOUDBASE_ENV });
    var db = app.database();
    var auth = app.auth({ persistence: 'local' });
    log('开始匿名登录…');
    auth.anonymousAuthProvider().signIn().then(function () {
      log('① 匿名登录成功');
      return db.collection('weights').get();
    }).then(function (res) {
      log('② 读取 weights 成功，条数 = ' + (res.data ? res.data.length : '?'));
      return db.collection('suggestions').add({
        date: '2026-09-26', content: '【云同步测试】直写建议', status: 'new', created_at: Date.now()
      });
    }).then(function (r) {
      log('③ 直写 suggestions 结果 = ' + (r && r.id ? '成功(直写通道可用)' : JSON.stringify(r)));
      return auth.signOut();
    }).then(function () {
      log('完成');
    }).catch(function (e) {
      log('ERR: ' + jerr(e));
    });
  } catch (e) {
    log('EXC: ' + (e.message || String(e)) + ' | ' + jerr(e));
  }
}, 3000);
</script>
</body>
</html>
